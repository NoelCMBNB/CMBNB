<!DOCTYPE html>
<html lang="en">
<head>
  <base target="_top">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #F3F8FA; --card: #FFFFFF; --surface: #F6FAFB; --text: #0B1B2B; --text-muted: #5E6E7E; --border: #E2EBEF;
      --accent: #A6FDFF; --accent-hover: #7CE9EC; --accent-strong: #0A9DA3; --accent-soft: rgba(166, 253, 255, 0.35);
      --ink: #0B1B2B; --danger: #E5484D; --danger-soft: rgba(229, 72, 77, 0.10); --success: #12A150;
      --up: #15803D; --up-bg: #EAF8EF; --dn: #B42318; --dn-bg: #FDECEC; --chg: #B45309; --chg-bg: #FFF6E5;
      --shadow: 0 1px 2px rgba(11, 27, 43, 0.04), 0 8px 24px -12px rgba(11, 27, 43, 0.12);
      --header-bg: rgba(255, 255, 255, 0.78); --radius: 18px;
    }
    [data-theme="dark"] {
      --bg: #0A121E; --card: #111C2B; --surface: #0E1724; --text: #EAF2F7; --text-muted: #93A4B6; --border: #213046;
      --accent-strong: #5FE6EA; --accent-soft: rgba(166, 253, 255, 0.10); --ink: #1A2940; --danger-soft: rgba(229, 72, 77, 0.16);
      --up: #4ADE80; --up-bg: rgba(74, 222, 128, 0.12); --dn: #F87171; --dn-bg: rgba(248, 113, 113, 0.14); --chg: #FBBF24; --chg-bg: rgba(251, 191, 36, 0.12);
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px -12px rgba(0, 0, 0, 0.5); --header-bg: rgba(17, 28, 43, 0.82);
    }
    * { box-sizing: border-box; }
    body { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; margin: 0; color: var(--text);
      background: radial-gradient(900px 340px at 50% -140px, var(--accent-soft), transparent 70%), var(--bg); background-attachment: fixed;
      -webkit-font-smoothing: antialiased; }
    .container { max-width: 640px; margin: 22px auto; padding: 0 16px 60px; }
    .header { position: sticky; top: 0; z-index: 100; display: flex; justify-content: space-between; align-items: center; gap: 8px;
      padding: 10px 16px; background: var(--header-bg); -webkit-backdrop-filter: saturate(160%) blur(14px); backdrop-filter: saturate(160%) blur(14px);
      border-bottom: 1px solid var(--border); }
    .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .logo { height: 30px; }
    .brand-sub { font-size: 12px; font-weight: 800; color: var(--text-muted); letter-spacing: 0.04em; text-transform: uppercase; white-space: nowrap; }
    .controls { display: flex; gap: 6px; align-items: center; }
    .icon-btn { background: var(--card); border: 1px solid var(--border); padding: 7px 12px; border-radius: 999px; cursor: pointer; color: var(--text);
      font-weight: 700; font-size: 12px; font-family: inherit; text-decoration: none; white-space: nowrap; }
    .icon-btn:hover { background: var(--accent); color: #0B1B2B; border-color: var(--accent); }

    .card { background: var(--card); padding: 24px 20px; border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid var(--border); }
    .hero { text-align: center; }
    .hero h1 { margin: 10px 0 4px; font-size: 24px; letter-spacing: -0.02em; }
    .hero p { margin: 0; color: var(--text-muted); font-size: 14px; }
    .side-selector { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 22px; }
    .side-btn { padding: 18px 12px; border-radius: 16px; border: 1.5px solid var(--border); background: var(--surface); color: var(--text);
      font-weight: 800; font-size: 14px; font-family: inherit; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .side-btn:hover { background: var(--accent); color: #0B1B2B; border-color: var(--accent-hover); }
    .side-btn span:first-child { font-size: 26px; }

    .topbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; }
    .side-chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 999px; background: var(--accent-soft);
      color: var(--accent-strong); font-size: 11px; font-weight: 800; letter-spacing: 0.06em; cursor: pointer; border: none; font-family: inherit; }
    .tabs { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 4px; background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 4px; margin-bottom: 14px; }
    .tabs button { border: none; background: transparent; padding: 11px 6px; border-radius: 10px; font-family: inherit; font-weight: 800; font-size: 13px; color: var(--text-muted); cursor: pointer; }
    .tabs button.on { background: var(--accent); color: #0B1B2B; }

    h2 { margin: 0 0 4px; font-size: 21px; font-weight: 800; letter-spacing: -0.02em; }
    label { font-size: 11px; font-weight: 800; color: var(--text-muted); display: block; margin-top: 16px; text-transform: uppercase; letter-spacing: 0.06em; }
    input, select, textarea { width: 100%; padding: 12px 14px; margin-top: 6px; border-radius: 12px; border: 1px solid var(--border);
      background: var(--surface); color: var(--text); font-family: inherit; font-size: 14px; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent-strong); background: var(--card); box-shadow: 0 0 0 4px var(--accent-soft); }
    .main-btn { background: var(--accent); color: #0B1B2B; border: 1px solid var(--accent-hover); font-weight: 800; font-family: inherit; cursor: pointer;
      margin-top: 22px; font-size: 15px; border-radius: 12px; padding: 14px; width: 100%; }
    .main-btn:disabled { opacity: 0.6; cursor: wait; }
    .secondary-btn { background: var(--card); color: var(--text); border: 1px solid var(--border); }

    .inv-types { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 4px; margin-top: 6px; }
    .inv-type { padding: 11px 4px; text-align: center; font-size: 12px; font-weight: 700; border-radius: 9px; cursor: pointer; color: var(--text-muted); }
    .inv-type.active { background: var(--accent); color: #0B1B2B; }
    .inv-size { display: flex; gap: 10px; margin-top: 6px; }
    .inv-size button { flex: 1; padding: 13px; border-radius: 12px; border: 1.5px solid var(--border); background: var(--surface); color: var(--text); font-weight: 800; cursor: pointer; font-family: inherit; }
    .inv-size button.active { background: var(--accent); border-color: var(--accent-hover); color: #0B1B2B; }
    .inv-table { margin-top: 18px; border-top: 1px solid var(--border); }
    .inv-sec { display: flex; justify-content: space-between; padding: 16px 4px 10px; font-size: 11px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-muted); border-bottom: 1px solid var(--border); }
    .inv-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 4px; border-bottom: 1px solid var(--border); }
    .inv-lbl { font-size: 14px; font-weight: 600; flex: 1; line-height: 1.3; }
    .inv-hint { font-size: 10px; color: var(--text-muted); margin-top: 3px; font-weight: 500; }
    .inv-prev { display: inline-block; font-size: 10.5px; font-weight: 700; color: var(--accent-strong); background: var(--accent-soft); padding: 2px 7px; border-radius: 6px; margin-top: 4px; }
    .inv-step { display: flex; flex-shrink: 0; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
    .inv-step button { width: 42px; border: none; background: var(--ink); color: #FFF; font-size: 20px; font-weight: 800; cursor: pointer; font-family: inherit; }
    .inv-step input { width: 58px; margin: 0; padding: 10px 0; border: none; border-radius: 0; text-align: center; font-weight: 800; font-size: 16px; background: var(--card); box-shadow: none; }
    .inv-seg { display: flex; flex-shrink: 0; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
    .inv-seg button { min-width: 46px; padding: 10px 8px; border: none; border-left: 1px solid var(--border); background: var(--surface); color: var(--text-muted); font-weight: 700; font-size: 12px; cursor: pointer; font-family: inherit; }
    .inv-seg button:first-child { border-left: none; }
    .inv-seg button.on { background: var(--accent); color: #0B1B2B; }
    .inv-client { display: none; align-items: center; justify-content: space-between; gap: 10px; margin-top: 10px; padding: 10px 14px; border-radius: 12px; background: var(--accent-soft); border: 1px solid var(--accent-hover); font-size: 12px; }
    .inv-client span { color: var(--text-muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; font-size: 10px; }
    .inv-client b { font-size: 14px; }
    .prev-box { display: none; margin-top: 10px; padding: 12px 14px; border-radius: 12px; border: 1px dashed var(--border); background: var(--surface); font-size: 12.5px; line-height: 1.5; }
    .prev-box a { color: var(--accent-strong); font-weight: 800; }
    .inv-add { display: flex; gap: 8px; padding: 12px 0 0; }
    .inv-add input { margin-top: 0; flex: 1; }
    .inv-add button { padding: 0 16px; border-radius: 12px; border: 1px dashed var(--accent-strong); background: var(--accent-soft); color: var(--text); font-weight: 800; font-family: inherit; cursor: pointer; }
    .inv-x { border: none; background: var(--danger-soft); color: var(--danger); border-radius: 6px; font-size: 10px; padding: 2px 6px; margin-left: 6px; cursor: pointer; }
    .ok-box { margin-top: 16px; padding: 16px; border-radius: 14px; background: rgba(18, 161, 80, 0.10); border: 1px solid rgba(18, 161, 80, 0.3); font-size: 13px; line-height: 1.55; }
    .ok-box b.t { display: block; color: var(--success); font-size: 15px; margin-bottom: 4px; }
    .ok-links { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    .pill-link { display: inline-block; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--card); color: var(--text); font-weight: 700; font-size: 12px; text-decoration: none; cursor: pointer; font-family: inherit; }

    .sec-title { font-size: 11px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.08em; margin: 22px 0 8px 2px; }
    .cmp-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 14px; background: var(--card); }
    table.cmp { border-collapse: separate; border-spacing: 0; font-size: 12px; min-width: 100%; }
    table.cmp th, table.cmp td { padding: 8px 10px; border-bottom: 1px solid var(--border); text-align: center; white-space: nowrap; }
    table.cmp th { background: var(--surface); font-size: 11px; font-weight: 800; vertical-align: bottom; }
    table.cmp th small { display: block; font-weight: 600; color: var(--text-muted); font-size: 10px; margin-top: 2px; }
    table.cmp th:first-child, table.cmp td:first-child { position: sticky; left: 0; background: var(--card); text-align: left; white-space: normal; min-width: 150px; max-width: 190px; font-weight: 600; border-right: 1px solid var(--border); z-index: 1; }
    table.cmp th:first-child { background: var(--surface); }
    table.cmp tr.sec td { background: var(--surface); text-align: left; font-size: 10px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-muted); }
    table.cmp td.up { color: var(--up); background: var(--up-bg); font-weight: 800; }
    table.cmp td.dn { color: var(--dn); background: var(--dn-bg); font-weight: 800; }
    table.cmp td.chg { color: var(--chg); background: var(--chg-bg); font-weight: 800; }
    table.cmp td small { font-size: 10px; margin-left: 3px; }
    table.cmp td.na { color: var(--text-muted); }
    .legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 11px; color: var(--text-muted); margin: 8px 2px 0; }
    .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }
    .hcard { border: 1px solid var(--border); border-radius: 14px; padding: 14px; background: var(--card); margin-bottom: 10px; }
    .hcard-top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
    .hcard-top b { font-size: 14px; }
    .hcard-id { font-family: ui-monospace, Menlo, monospace; font-size: 10.5px; color: var(--text-muted); }
    .hstats { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    .hstats span { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: var(--surface); border: 1px solid var(--border); }
    .hchg { margin-top: 8px; font-size: 12px; line-height: 1.5; }
    .muted { color: var(--text-muted); }
    .err-box { margin-top: 16px; padding: 14px 16px; border-radius: 14px; background: var(--danger-soft); border: 1px solid rgba(229, 72, 77, 0.35); font-size: 13px; line-height: 1.5; }
    .err-box b.t { display: block; color: var(--danger); font-size: 15px; margin-bottom: 4px; }
    .warn-line { margin-top: 6px; font-size: 12px; color: var(--chg); font-weight: 700; }
    .rep-filters { display: grid; grid-template-columns: 1fr; gap: 0; }
    .rep-paper { margin-top: 18px; background: #FFFFFF; color: #0B1B2B; border-radius: 14px; border: 1px solid var(--border); padding: 18px 14px; overflow: hidden; }
    .rep-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .rep-actions .pill-link { flex: 1; text-align: center; padding: 11px 10px; }
    #err-toast { display: none; position: fixed; left: 12px; right: 12px; bottom: 12px; z-index: 3000; background: #B42318; color: #fff; padding: 12px 14px;
      border-radius: 12px; font: 600 12px/1.45 system-ui, sans-serif; max-height: 40vh; overflow: auto; }
    @media (max-width: 420px) { .brand-sub { display: none; } .card { padding: 20px 16px; } }

    @media screen { #inv-print { display: none; } }
    @media print {
      @page { margin: 10mm; }
      * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      body { background: #fff !important; }
      .header, .container, #err-toast { display: none !important; }
      #inv-print { display: block !important; }
    }
  </style>
</head>
<body data-theme="light">

  <div class="header">
    <div class="brand">
      <img src="https://i.postimg.cc/TY4rPG9j/bnblogo.png" class="logo" alt="Clean My BnB">
      <span class="brand-sub" data-t="appTitle">Inventories</span>
    </div>
    <div class="controls">
      <a class="icon-btn" id="lnk-hub" target="_top" style="display:none;" onclick="irAlHub(this)">← Hub</a>
      <button class="icon-btn" onclick="toggleLang()" id="btn-lang">🌐 EN</button>
      <button class="icon-btn" onclick="toggleTheme()" id="btn-theme">🌙</button>
    </div>
  </div>

  <div class="container">

    <!-- ===== Elegir zona ===== -->
    <div id="view-side" class="card hero" style="display:none;">
      <img src="https://i.postimg.cc/TY4rPG9j/bnblogo.png" alt="" style="height:64px;">
      <h1 data-t="appTitle">Inventories</h1>
      <p data-t="chooseSide">Choose your area to continue</p>
      <div class="side-selector">
        <button class="side-btn" onclick="setSide('west')"><span>🌇</span><span>WEST SIDE</span></button>
        <button class="side-btn" onclick="setSide('east')"><span>🌆</span><span>EAST SIDE</span></button>
      </div>
    </div>

    <!-- ===== App ===== -->
    <div id="view-main" style="display:none;">
      <div class="topbar">
        <h2 data-t="appTitle">Inventories</h2>
        <button class="side-chip" id="side-chip" onclick="changeSide()"></button>
      </div>
      <div class="tabs">
        <button id="tab-form" class="on" onclick="showPane('form')">📝 <span data-t="tabNew">New inventory</span></button>
        <button id="tab-hist" onclick="showPane('hist')">📊 <span data-t="tabHist">History</span></button>
        <button id="tab-rep" onclick="showPane('rep')">📈 <span data-t="tabRep">Reports</span></button>
      </div>

      <!-- Nuevo inventario -->
      <div id="pane-form" class="card">
        <div style="display:flex; justify-content:flex-end; margin:-8px 0 12px;">
          <button type="button" class="pill-link" onclick="invNew()">🔄 <span data-t="newInv">New inventory</span></button>
        </div>
        <div class="inv-types">
          <div class="inv-type active" id="invtab-supplies" onclick="invSetType('supplies')">🧴 <span data-t="tSupplies">Supplies</span></div>
          <div class="inv-type" id="invtab-linen" onclick="invSetType('linen')">🛏️ <span data-t="tLinen">Linen</span></div>
          <div class="inv-type" id="invtab-cutlery" onclick="invSetType('cutlery')">🍴 <span data-t="tCutlery">Kitchen</span></div>
        </div>

        <label data-t="date">Date</label>
        <input type="date" id="invf-date" onchange="invLoadPrev()">

        <label data-t="name">Cleaner Name</label>
        <select id="invf-name"></select>

        <label data-t="building">Building</label>
        <select id="invf-building" onchange="invBuildingChanged()"></select>

        <div id="invf-unit-wrap" style="display:none;">
          <label data-t="unit">Unit</label>
          <select id="invf-unit" onchange="invUnitChanged()"></select>
        </div>

        <div id="invf-other-wrap" style="display:none;">
          <label data-t="newBuilding">New building</label>
          <input type="text" id="invf-newb" placeholder="e.g. 50 York">
          <label data-t="unit">Unit</label>
          <input type="text" id="invf-newu" placeholder="e.g. 1204">
          <label data-t="client">Client</label>
          <select id="invf-newc"></select>
        </div>

        <div id="invf-client-chip" class="inv-client"></div>
        <div id="invf-prev" class="prev-box"></div>

        <div id="invf-size-wrap" style="display:none;">
          <label data-t="size">Bed Size</label>
          <div class="inv-size">
            <button type="button" id="invsize-Queen" onclick="invSetSize('Queen')">QUEEN</button>
            <button type="button" id="invsize-King" onclick="invSetSize('King')">KING</button>
          </div>
        </div>

        <div id="invf-items" class="inv-table"></div>

        <label data-t="notes">Notes</label>
        <textarea id="invf-notes" rows="3"></textarea>

        <label data-t="photos">Photos</label>
        <input type="file" id="invf-fotos" accept="image/*" multiple>
        <div class="inv-hint" data-t="photosHint"></div>

        <button class="main-btn" id="invx-submit-btn" onclick="invSubmit()">💾 <span id="invx-submit" data-t="submit">Save Inventory</span></button>
        <button class="main-btn secondary-btn" onclick="invPrint()" style="margin-top: 10px;">🖨️ <span data-t="print">Download PDF</span></button>
        <div id="invf-result"></div>
      </div>

      <!-- Historial y comparación -->
      <div id="pane-hist" class="card" style="display:none;">
        <label style="margin-top:0;" data-t="building">Building</label>
        <select id="h-building" onchange="hBuildingChanged()"></select>
        <label data-t="unit">Unit</label>
        <select id="h-unit"></select>
        <label data-t="type">Type</label>
        <div class="inv-types">
          <div class="inv-type active" id="htab-supplies" onclick="hSetType('supplies')">🧴 <span data-t="tSupplies">Supplies</span></div>
          <div class="inv-type" id="htab-linen" onclick="hSetType('linen')">🛏️ <span data-t="tLinen">Linen</span></div>
          <div class="inv-type" id="htab-cutlery" onclick="hSetType('cutlery')">🍴 <span data-t="tCutlery">Kitchen</span></div>
        </div>
        <label data-t="histPass">Admin password</label>
        <input type="password" id="h-pass" onkeydown="if(event.key === 'Enter') hLoad()">
        <button class="main-btn" id="h-btn" onclick="hLoad()" data-t="histLoad">View history</button>
        <div id="h-result"></div>
      </div>

      <!-- Reportes -->
      <div id="pane-rep" class="card" style="display:none;">
        <h2 style="font-size:18px;" data-t="repTitle">Reports</h2>
        <div class="inv-hint" style="font-size:12px;" data-t="repIntro"></div>
        <label data-t="type">Type</label>
        <div class="inv-types">
          <div class="inv-type active" id="rtab-linen" onclick="repSetType('linen')">🛏️ <span data-t="tLinen">Linen</span></div>
          <div class="inv-type" id="rtab-supplies" onclick="repSetType('supplies')">🧴 <span data-t="tSupplies">Supplies</span></div>
          <div class="inv-type" id="rtab-cutlery" onclick="repSetType('cutlery')">🍴 <span data-t="tCutlery">Kitchen</span></div>
        </div>
        <label data-t="repClient">Client or group</label>
        <select id="r-filtro"></select>
        <label data-t="repSide">Area</label>
        <select id="r-side">
          <option value="" data-t="repBoth">Both (West + East)</option>
          <option value="WEST">WEST</option>
          <option value="EAST">EAST</option>
        </select>
        <label data-t="histPass">Admin password</label>
        <input type="password" id="r-pass" onkeydown="if(event.key === 'Enter') repLoad()">
        <button class="main-btn" id="r-btn" onclick="repLoad()" data-t="repGen">Generate report</button>
        <div id="r-actions" class="rep-actions" style="display:none;">
          <button class="pill-link" type="button" id="r-save" onclick="repExport()">💾 <span data-t="repSave">Save to Drive + Sheets</span></button>
          <button class="pill-link" type="button" onclick="repPrint()">🖨️ <span data-t="print">Download PDF</span></button>
        </div>
        <button class="main-btn" id="r-client" type="button" onclick="repClientPdf()" style="display:none; margin-top:10px; background:var(--ink); color:#fff; border-color:var(--ink);">📄 <span data-t="repClientPdf">Client PDF (by building)</span></button>
        <div class="inv-hint" id="r-client-hint" style="display:none;" data-t="repClientHint"></div>
        <div id="r-msg"></div>
        <div id="r-result"></div>
      </div>
    </div>
  </div>

  <div id="inv-print"></div>
  <div id="err-toast" onclick="this.style.display='none'"></div>

  <script>
    var BOOT = <?!= boot ?>;
    var lang = BOOT.lang || 'en';
    var currentSide = BOOT.side || '';
    var staffData = {};
    var LISTS_KEY = 'cmb_inv_lists_v1';

    var APP_ERRORS = [];
    function showErr(msg) {

    var UNIT_OTHER = '__other__';
    var _uIdx = null, _uIdxKey = '';
    function unitNorm(s) { return String(s === undefined || s === null ? '' : s).split(' ').filter(String).join(' '); }
    function unitIsLocker(u) { return String(u).toUpperCase().indexOf('STORAGE') === 0; }
    function unitSort(a, b) { return String(a).localeCompare(String(b), undefined, { numeric: true, sensitivity: 'base' }); }
    function unitIndex() {
      var all = staffData.unidades || [];
      var sd = String(currentSide || '').toUpperCase();
      var key = sd + '|' + all.length + '|' + (staffData.ts || '');
      if (_uIdx && _uIdxKey === key) return _uIdx;
      var idx = { list: [], buildings: [], byB: {}, client: {} };
      all.forEach(function (r) {
        if (sd && r[3] && r[3] !== sd) return;
        idx.list.push(r);
        var kb = r[0].toUpperCase();
        if (!idx.byB[kb]) { idx.byB[kb] = { name: r[0], lockers: [], units: [] }; idx.buildings.push(r[0]); }
        if (unitIsLocker(r[1])) idx.byB[kb].lockers.push(r[1]); else idx.byB[kb].units.push(r[1]);
        idx.client[kb + '|' + r[1].toUpperCase()] = r[2];
      });
      idx.buildings.sort(unitSort);
      Object.keys(idx.byB).forEach(function (k) { idx.byB[k].lockers.sort(unitSort); idx.byB[k].units.sort(unitSort); });
      _uIdx = idx; _uIdxKey = key;
      return idx;
    }
    function unitClientOf(b, u) { return unitIndex().client[String(b).toUpperCase() + '|' + String(u).toUpperCase()] || ''; }
    function unitOptions(values, placeholder, current) {
      var h = '<option value="" disabled' + (current ? '' : ' selected') + '>' + invEsc(placeholder) + '</option>';
      values.forEach(function (v) { h += '<option value="' + invEsc(v) + '"' + (v === current ? ' selected' : '') + '>' + invEsc(v) + '</option>'; });
      return h;
    }
    function unitUnitOptions(building, placeholder, current) {
      var T = invT();
      var g = unitIndex().byB[String(building).toUpperCase()];
      var h = '<option value="" disabled' + (current ? '' : ' selected') + '>' + invEsc(placeholder) + '</option>';
      if (!g) return h;
      function opt(v, label) { return '<option value="' + invEsc(v) + '"' + (v === current ? ' selected' : '') + '>' + invEsc(label) + '</option>'; }
      if (g.lockers.length) {
        h += '<optgroup label="' + invEsc(T.lockersGroup) + '">';
        g.lockers.forEach(function (u) { h += opt(u, '🔒 ' + T.lockerWord + ' - ' + (unitClientOf(building, u) || u)); });
        h += '</optgroup><optgroup label="' + invEsc(T.unitsGroup) + '">';
      }
      g.units.forEach(function (u) { h += opt(u, u); });
      if (g.lockers.length) h += '</optgroup>';
      return h;
    }
    function unitAllClients() {
      var seen = {}, out = [];

        c = unitNorm(c);
        if (c && !seen[c.toUpperCase()]) { seen[c.toUpperCase()] = true; out.push(c); }
      });
      return out.sort(unitSort);
    }

    function invBuildingChanged(keepUnit) {
      var T = invT();
      var b = document.getElementById('invf-building').value;
      var isOther = b === UNIT_OTHER;
      document.getElementById('invf-other-wrap').style.display = isOther ? 'block' : 'none';
      document.getElementById('invf-unit-wrap').style.display = (b && !isOther) ? 'block' : 'none';
      var uSel = document.getElementById('invf-unit');
      var cur = keepUnit === true ? uSel.value : '';
      uSel.innerHTML = (b && !isOther) ? unitUnitOptions(b, T.pickUnit, cur) : '';
      invUnitChanged();
    }

    function invUnitChanged() {
      var T = invT();
      var b = document.getElementById('invf-building').value;
      var u = document.getElementById('invf-unit').value;
      var chip = document.getElementById('invf-client-chip');
      var c = (b && b !== UNIT_OTHER && u) ? unitClientOf(b, u) : '';
      chip.style.display = c ? 'flex' : 'none';
      chip.innerHTML = c ? ('<span>' + invEsc(T.clientLbl) + '</span><b>' + invEsc(c) + '</b>') : '';
      invLoadPrev();
    }

    // { building, unit, client } o null
    function invGetUnit() {
      var b = document.getElementById('invf-building').value;
      if (b === UNIT_OTHER) {
        var nb = unitNorm(document.getElementById('invf-newb').value);
        var nu = unitNorm(document.getElementById('invf-newu').value);
        var nc = document.getElementById('invf-newc').value;
        if (!nb || !nu || !nc) return null;
        return { building: nb, unit: nu, client: unitClientOf(nb, nu) || nc };
      }
      var u = document.getElementById('invf-unit').value;
      if (!b || !u) return null;
      return { building: b, unit: u, client: unitClientOf(b, u) };
    }

    // ---------- Inventario anterior ----------
    function invLoadPrev() {
      if (!currentSide) return;
      var b = document.getElementById('invf-building').value;
      var u = document.getElementById('invf-unit').value;
      var fecha = document.getElementById('invf-date').value;
      var hasUnit = b && b !== UNIT_OTHER && u;
      var size = invType === 'linen' ? invSize : '';
      var key = hasUnit ? [b, u, invType, fecha, size].join('|') : '';
      if (key === invPrevKey) { invRender(); return; }
      invPrevKey = key;
      invPrev = null;
      var seq = ++invPrevSeq;
      var box = document.getElementById('invf-prev');
      if (!hasUnit) { invApplyPrevCustom(); invRenderPrevBox(); invRender(); return; }
      box.style.display = 'block';
      box.innerHTML = '<span class="muted">' + invEsc(invT().prevLoading) + '</span>';
      invApplyPrevCustom();
      invRender();
      google.script.run
        .withSuccessHandler(function (r) {
          if (seq !== invPrevSeq) return;
          if (r && r.error) showErr(r.error);
          invPrev = (r && !r.none && !r.error) ? r : { none: true };
          invApplyPrevCustom();
          invRenderPrevBox();
          invRender();
        })
        .withFailureHandler(function (e) { if (seq !== invPrevSeq) return; box.style.display = 'none'; showErr(e); })
        .getUltimoInventario(b, u, invType, fecha, size);
    }

    function invHasPrev() { return !!(invPrev && !invPrev.none); }

    function invRenderPrevBox() {
      var box = document.getElementById('invf-prev');
      var T = invT();
      if (!invPrev) { if (!invPrevKey) box.style.display = 'none'; return; }
      box.style.display = 'block';
      if (!invHasPrev()) { box.innerHTML = '🆕 ' + invEsc(T.prevNone); return; }
      var p = invPrev;
      box.innerHTML = '📋 <b>' + invEsc(T.prevTitle) + ':</b> ' + invEsc(p.fecha) + ' · ' + invEsc(T.prevBy) + ' ' + invEsc(p.cleaner) +
        (p.size ? ' · ' + invEsc(p.size) : '') +
        (String(p.pdf).indexOf('http') === 0 ? ' · <a href="' + invEsc(p.pdf) + '" target="_blank">' + invEsc(T.viewPdf) + '</a>' : '') +
        (p.notas ? '<div class="muted" style="margin-top:4px;">“' + invEsc(p.notas) + '”</div>' : '') +
        '<div class="muted" style="margin-top:4px; font-size:11px;">' + invEsc(T.prevHint) + '</div>';
    }

    // Los artículos adicionales del inventario anterior se vuelven a poner para contarlos otra vez
    function invApplyPrevCustom() {
      var list = invCustom[invType].filter(function (c) { return !c.auto; });
      var vals = invValues[invType];
      invCustom[invType].forEach(function (c) { if (c.auto) delete vals[c.id]; });
      if (invHasPrev()) {
        (invPrev.custom || []).forEach(function (c, i) {
          var exists = list.some(function (x) { return x.name.toUpperCase() === String(c.n).toUpperCase(); });
          if (exists) return;
          var id = 'cp' + i;
          list.push({ id: id, name: String(c.n), auto: true });
          vals[id] = 0;
        });
      }
      invCustom[invType] = list;
    }

    function invPrevHint(key, kind) {
      if (!invHasPrev()) return '';
      var v = invPrev.values[key];
      return '<div class="inv-prev">' + invEsc(invT().prevWord) + ': ' + invEsc(fmtVal(v, kind)) + '</div>';
    }

    function invRender() {
      var T = invT(), L = invL(), vals = invValues[invType];
      var h = '';
      INV_DEF[invType].forEach(function (sec) {
        h += '<div class="inv-sec"><span>' + sec[L] + '</span><span>' + T.col[sec.col] + '</span></div>';
        sec.items.forEach(function (it) {
          var kind = it.kind || sec.kind;
          var ctrl = '', hint = '';
          if (kind === 'count') {
            var step = it.step || 1;
            if (step < 1) hint = '<div class="inv-hint">' + T.partial + '</div>';
            ctrl = '<div class="inv-step">' +
              '<button type="button" data-act="step" data-id="' + it.id + '" data-d="-' + step + '">-</button>' +
              '<input type="text" inputmode="decimal" class="inv-qty" id="invq-' + it.id + '" data-id="' + it.id + '" value="' + invNum(vals[it.id]) + '">' +
              '<button type="button" data-act="step" data-id="' + it.id + '" data-d="' + step + '">+</button></div>';
          } else {
            var opts = kind === 'ynna' ? ['YES', 'NO', 'N/A'] : ['YES', 'NO'];
            var lbl = { 'YES': T.yes, 'NO': T.no, 'N/A': T.na };
            ctrl = '<div class="inv-seg">';
            opts.forEach(function (o) {
              ctrl += '<button type="button" data-act="pick" data-id="' + it.id + '" data-v="' + o + '" class="' + (vals[it.id] === o ? 'on' : '') + '">' + lbl[o] + '</button>';
            });
            ctrl += '</div>';
          }
          h += '<div class="inv-row"><div class="inv-lbl">' + it[L] + hint + invPrevHint(it.en, kind) + '</div>' + ctrl + '</div>';
        });
      });

      h += '<div class="inv-sec"><span>' + invEsc(T.customTitle) + '</span><span>' + T.col.qty + '</span></div>';
      invCustom[invType].forEach(function (c) {
        h += '<div class="inv-row"><div class="inv-lbl">' + invEsc(c.name) +
          ' <button type="button" class="inv-x" data-act="delcustom" data-id="' + c.id + '">✕</button>' + invPrevHint(c.name, 'count') + '</div>' +
          '<div class="inv-step">' +
          '<button type="button" data-act="step" data-id="' + c.id + '" data-d="-1">-</button>' +
          '<input type="text" inputmode="decimal" class="inv-qty" id="invq-' + c.id + '" data-id="' + c.id + '" value="' + invNum(vals[c.id]) + '">' +
          '<button type="button" data-act="step" data-id="' + c.id + '" data-d="1">+</button></div></div>';
      });
      h += '<div class="inv-add"><input type="text" id="invc-name" maxlength="60" placeholder="' + invEsc(T.customPh) + '">' +
        '<button type="button" data-act="addcustom">+ ' + invEsc(T.customAdd) + '</button></div>' +
        '<div class="inv-hint" style="padding:6px 4px 0;">' + invEsc(T.customHint) + '</div>';
      document.getElementById('invf-items').innerHTML = h;
    }

    function invAddCustom() {
      var inp = document.getElementById('invc-name');
      var name = unitNorm(inp.value);
      if (!name) { inp.focus(); return; }
      var list = invCustom[invType];
      for (var i = 0; i < list.length; i++) if (list[i].name.toUpperCase() === name.toUpperCase()) { inp.value = ''; return; }
      var id = 'cx' + Date.now();
      list.push({ id: id, name: name });
      invValues[invType][id] = 1;
      invRender();
      var q = document.getElementById('invc-name'); if (q) q.focus();
    }

    function invBindEvents() {
      var box = document.getElementById('invf-items');
      box.addEventListener('click', function (e) {
        var b = e.target.closest('button');
        if (!b) return;
        var id = b.getAttribute('data-id'), act = b.getAttribute('data-act');
        var vals = invValues[invType];
        if (act === 'step') {
          var inp = document.getElementById('invq-' + id);
          var n = invNum(invNum(inp.value) + parseFloat(b.getAttribute('data-d')));
          inp.value = n; vals[id] = n;
        } else if (act === 'addcustom') {
          invAddCustom();
        } else if (act === 'delcustom') {
          invCustom[invType] = invCustom[invType].filter(function (c) { return c.id !== id; });
          delete vals[id];
          invRender();
        } else if (act === 'pick') {
          var v = b.getAttribute('data-v');
          vals[id] = (vals[id] === v) ? '' : v;
          b.parentNode.querySelectorAll('button').forEach(function (x) { x.classList.remove('on'); });
          if (vals[id]) b.classList.add('on');
        }
      });
      box.addEventListener('input', function (e) {
        if (e.target.classList.contains('inv-qty')) invValues[invType][e.target.getAttribute('data-id')] = invNum(e.target.value);
      });
      box.addEventListener('keydown', function (e) {
        if (e.target.id === 'invc-name' && e.key === 'Enter') { e.preventDefault(); invAddCustom(); }
      });
      box.addEventListener('focusin', function (e) { if (e.target.classList.contains('inv-qty')) e.target.select(); });
      box.addEventListener('focusout', function (e) { if (e.target.classList.contains('inv-qty')) e.target.value = invNum(e.target.value); });
    }

    function invCollect() {
      var T = invT(), L = invL(), vals = invValues[invType];
      var fecha = document.getElementById('invf-date').value;
      var cleaner = document.getElementById('invf-name').value;
      var un = invGetUnit();
      if (!fecha || !cleaner || !un) { alert(T.missing); return null; }
      if (invType === 'linen' && !invSize) { alert(T.missingSize); return null; }
      var lbl = { 'YES': T.yes, 'NO': T.no, 'N/A': T.na };
      var items = [];
      INV_DEF[invType].forEach(function (sec) {
        sec.items.forEach(function (it) {
          var kind = it.kind || sec.kind, value, display;
          if (kind === 'count') { value = invNum(vals[it.id]); display = String(value); }
          else { value = vals[it.id] || ''; display = value ? lbl[value] : '-'; }
          items.push({ key: it.en, label: it[L], section: sec[L], sectionEn: sec.en, colKey: sec.col, kind: kind, value: value, display: display });
        });
      });
      return {
        side: currentSide, tipo: invType, cleaner: cleaner, fecha: fecha,
        building: un.building, unit: un.unit, client: un.client,
        propiedad: un.building + ' - ' + (unitIsLocker(un.unit) ? 'Locker' : un.unit),
        size: invType === 'linen' ? invSize : '',
        notas: document.getElementById('invf-notes').value.trim(),
        items: items,
        custom: invCustom[invType].map(function (c) { return { name: c.name, value: invNum(vals[c.id]) }; })
      };
    }

    function invMakeId() {
      var d = new Date();
      function z(n) { return String(n).padStart(2, '0'); }
      return 'INV-' + String(d.getFullYear()).slice(2) + z(d.getMonth() + 1) + z(d.getDate()) + '-' +
        z(d.getHours()) + z(d.getMinutes()) + z(d.getSeconds()) + '-' + Math.floor(100 + Math.random() * 900);
    }

    function compressImage(file, callback) {
      var reader = new FileReader();
      reader.onload = function (e) {
        var img = new Image();
        img.onload = function () {
          var MAX = 1280, w = img.width, h = img.height;
          if (w > MAX) { h = Math.round(h * MAX / w); w = MAX; }
          var c = document.createElement('canvas'); c.width = w; c.height = h;
          c.getContext('2d').drawImage(img, 0, 0, w, h);
          callback(c.toDataURL('image/jpeg', 0.7).split(',')[1], 'image/jpeg');
        };
        img.onerror = function () { callback(null); };
        img.src = e.target.result;
      };
      reader.onerror = function () { callback(null); };
      reader.readAsDataURL(file);
    }
    function invReadPhotos(cb) {
      var files = Array.prototype.slice.call(document.getElementById('invf-fotos').files || [], 0, 6);
      var out = [], i = 0;
      (function next() {
        if (i >= files.length) return cb(out);
        compressImage(files[i++], function (b64, type) { if (b64) out.push({ b64: b64, type: type }); next(); });
      })();
    }

    function invSubmit() {
      var p = invCollect();
      if (!p) return;
      var T = invT();
      var btn = document.getElementById('invx-submit-btn');
      var lbl = document.getElementById('invx-submit');
      btn.disabled = true;
      lbl.innerText = T.uploading;
      p.id = invMakeId();
      var prev = invHasPrev() ? invPrev : null;
      invReadPhotos(function (fotos) {
        p.fotos = fotos;
        p.html = '<html><head><meta charset="utf-8"></head><body>' + invBuildReport(p, prev) + '</body></html>';
        lbl.innerText = T.saving;
        google.script.run
          .withSuccessHandler(function (r) {
            btn.disabled = false; lbl.innerText = invT().submit;
            if (!r || !r.success) return invShowFail(r ? r.error : 'Sin respuesta del servidor');
            var T2 = invT();
            var links = '';
            if (String(r.pdfUrl).indexOf('http') === 0) links += '<a class="pill-link" href="' + invEsc(r.pdfUrl) + '" target="_blank">📄 ' + invEsc(T2.openPdf) + '</a>';
            if (r.folder) links += '<a class="pill-link" href="' + invEsc(r.folder) + '" target="_blank">📁 ' + invEsc(T2.openFolder) + '</a>';
            links += '<button class="pill-link" type="button" onclick="invNew(true)">➕ ' + invEsc(T2.newInv) + '</button>';
            document.getElementById('invf-result').innerHTML =
              '<div class="ok-box"><b class="t">✅ ' + invEsc(T2.savedTitle) + '</b>' +
              invEsc(p.propiedad) + (r.client ? ' (' + invEsc(r.client) + ')' : '') + '<br>' +
              '<span class="muted">' + invEsc(T2.savedId) + ':</span> <b style="font-family:ui-monospace,Menlo,monospace;">' + invEsc(r.id) + '</b>' +
              (r.fotos ? ' · ' + r.fotos + ' ' + invEsc(T2.photosWord) : '') + '<br>' +
              '<span class="muted">' + invEsc(T2.changes) + ':</span> ' + invEsc(r.cambios) +
              ((r.avisos && r.avisos.length) ? '<div class="warn-line">⚠ ' + invEsc(T2.warnSaved) + ' ' + invEsc(r.avisos.join(' · ')) + '</div>' : '') +
              '<div class="ok-links">' + links + '</div></div>';
            // Si era una unidad nueva, se agrega a la lista local
            if (!unitClientOf(p.building, p.unit)) {
              (staffData.unidades = staffData.unidades || []).push([p.building, p.unit, r.client || p.client, String(currentSide).toUpperCase()]);
              _uIdx = null;
            }
            document.getElementById('invf-result').scrollIntoView({ behavior: 'smooth', block: 'center' });
          })
          .withFailureHandler(function (e) { btn.disabled = false; lbl.innerText = invT().submit; invShowFail(e && e.message ? e.message : e); })
          .guardarInventario(p);
      });
    }

    function invShowFail(msg) {
      var T = invT();
      var box = document.getElementById('invf-result');
      box.innerHTML = '<div class="err-box"><b class="t">❌ ' + invEsc(T.saveFail) + '</b>' + invEsc(msg) +
        '<div class="muted" style="margin-top:6px; font-size:12px;">' + invEsc(T.saveFailHint) + '</div>' +
        '<div class="ok-links"><button class="pill-link" type="button" onclick="invSubmit()">🔄 ' + invEsc(T.retry) + '</button></div></div>';
      box.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    // Botón "Nuevo inventario": deja el formulario limpio sin recargar la página
    function invHasData() {
      var any = false;
      Object.keys(invValues).forEach(function (t) {
        Object.keys(invValues[t]).forEach(function (k) { var v = invValues[t][k]; if (v !== '' && v !== 0 && v !== null && v !== undefined) any = true; });

    // ==========================================
    // PDF DEL INVENTARIO (se envía a clientes) · con comparación vs el anterior
    // INV_PDF_LANG: 'en' = siempre en inglés | 'auto' = idioma de la app
    // ==========================================
    var INV_PDF_LANG = 'en';
    var INV_PDF_TXT = {
      en: {
        kicker: 'INVENTORY REPORT', titles: { supplies: 'Inventory & Exit Checklist', linen: 'Bed Linen Inventory', cutlery: 'Kitchen Inventory' },
        property: 'Property', preparedFor: 'Prepared for', date: 'Date', preparedBy: 'Prepared by', bedSize: 'Bed size',

        outOfStock: 'Out of stock', itemsCounted: 'Total pieces counted', changed: 'Changes vs previous',
        prevInv: 'Compared with inventory of', firstInv: 'First inventory on record for this unit', by: 'by',
        notes: 'Notes from our team', footer: 'Prepared by Clean My BnB', generated: 'Generated', reportId: 'Report ID',

      },

    function invBuildReport(p, prev) {
      var PL = (INV_PDF_LANG === 'auto') ? invL() : INV_PDF_LANG;
      var R = INV_PDF_TXT[PL];
      var E = invEsc;
      var hasPrev = !!(prev && prev.values);
      var items = p.items.concat((p.custom || []).map(function (c) {
        return { key: c.name, label: c.name, section: R.additional, sectionEn: R.additional, colKey: 'qty', kind: 'count', value: c.value };
      }));

      var INK = '#0B1B2B', MUTED = '#6B7A89', LINE = '#E6EDF1', SOFT = '#F4F8FA', BRAND = '#A6FDFF', TEAL = '#0A8F95';
      function chip(text, bg, color) {
        return '<span style="display:inline-block;padding:1px 8px;border-radius:999px;background:' + bg + ';color:' + color + ';font-weight:bold;font-size:9px;letter-spacing:0.3px;">' + E(text) + '</span>';
      }
      function yn(v) { return v === 'YES' ? R.yes : v === 'NO' ? R.no : v === 'N/A' ? R.na : R.pending; }

      var restock = 0, exitIssues = 0, zero = 0, pieces = 0, changed = 0;
      items.forEach(function (it) {
        if (it.colKey === 'order' && it.value === 'YES') restock++;
        if (it.colKey === 'status' && it.value === 'NO') exitIssues++;
        if (it.kind === 'count') { pieces += Number(it.value) || 0; if (!(Number(it.value) > 0)) zero++; }
        if (hasPrev) {
          var pv = prev.values[it.key];
          if (pv !== undefined && pv !== null && pv !== '') {
            if (it.kind === 'count' ? (Number(pv) || 0) !== (Number(it.value) || 0) : String(pv) !== String(it.value)) changed++;
          }
        }
      });
      pieces = Math.round(pieces * 100) / 100;

      function sumCell(label, value, bg, color) {
        return '<td style="background:' + bg + ';border-radius:8px;padding:6px 10px;width:25%;">' +
          '<div style="font-size:7.5px;color:' + MUTED + ';font-weight:bold;letter-spacing:0.6px;text-transform:uppercase;">' + E(label) + '</div>' +
          '<div style="font-size:13px;font-weight:bold;color:' + color + ';margin-top:1px;">' + E(value) + '</div></td>';
      }
      var gap = '<td style="width:6px;"></td>';
      var summary;
      if (p.tipo === 'supplies') {
        summary = sumCell(R.restock, String(restock), restock ? '#FFF6E5' : '#EAF8EF', restock ? '#B45309' : '#15803D') + gap +
          sumCell(R.exitOk, exitIssues ? (exitIssues + ' ' + R.issues) : R.allGood, exitIssues ? '#FDECEC' : '#EAF8EF', exitIssues ? '#B42318' : '#15803D') + gap +
          sumCell(R.outOfStock, String(zero), zero ? '#FDECEC' : SOFT, zero ? '#B42318' : INK);
      } else {
        summary = sumCell(R.itemsCounted, String(pieces), SOFT, INK) + gap +
          sumCell(R.outOfStock, String(zero), zero ? '#FDECEC' : '#EAF8EF', zero ? '#B42318' : '#15803D') +
          (p.size ? gap + sumCell(R.bedSize, p.size.toUpperCase(), SOFT, INK) : '');
      }
      if (hasPrev) summary += gap + sumCell(R.changed, String(changed), changed ? '#FFF6E5' : '#EAF8EF', changed ? '#B45309' : '#15803D');

      // Artículos agrupados por sección y repartidos en DOS columnas para que el PDF quepa en una hoja
      var secs = [], cur = null;
      items.forEach(function (it) {

        tile(R.missing, String(S.sin), S.sin ? REDBG : GRNBG, S.sin ? RED : GRN) + gap +
        tile(R.coverage, S.cobertura + '%', S.cobertura < 80 ? AMBBG : GRNBG, S.cobertura < 80 ? AMB : GRN) +
        '</tr></table><table style="width:100%;border-collapse:separate;border-spacing:0;margin-top:6px;"><tr>' +
        tile(R.pieces, n(S.piezas), SOFT, INK) + gap +
        tile(R.losses, n(S.bajas), S.bajas ? REDBG : GRNBG, S.bajas ? RED : GRN) + gap +
        tile(R.old, String(S.viejas), S.viejas ? AMBBG : GRNBG, S.viejas ? AMB : GRN) +
        '</tr></table>';
      var isSup = r.tipo === 'supplies';
      if (isSup) {
        h += '<table style="width:100%;border-collapse:separate;border-spacing:0;margin-top:6px;"><tr>' +
          tile(R.itemsToOrder, String(S.pedir), S.pedir ? AMBBG : GRNBG, S.pedir ? AMB : GRN) + gap +
          tile(R.unitsAsking, String(S.unidadesPedir), S.unidadesPedir ? AMBBG : GRNBG, S.unidadesPedir ? AMB : GRN) + gap +
          tile(R.checkNo, String(S.check), S.check ? REDBG : GRNBG, S.check ? RED : GRN) +
          '</tr></table>';
      }

      // Totales generales
      h += title(R.general);
      var t1 = '<table style="width:100%;border-collapse:collapse;"><tr><td style="' + th + '">' + E(R.item) + '</td><td style="' + th + 'text-align:right;">' + E(R.total) + '</td><td style="' + th + 'text-align:right;">' + E(R.change) + '</td><td style="' + th + 'text-align:right;">' + E(R.atZero) + '</td></tr>';
      r.items.forEach(function (it, i) {
        var c = S.cambio[i];
        t1 += '<tr><td style="' + td + '">' + E(nameOf(it)) + '</td><td style="' + td + 'text-align:right;font-weight:bold;">' + n(S.totals[i]) + '</td>' +
          '<td style="' + td + 'text-align:right;font-weight:bold;color:' + (c < 0 ? RED : c > 0 ? GRN : MUTED) + ';">' + (c === null ? '-' : (c > 0 ? '+' : '') + n(c)) + '</td>' +
          '<td style="' + td + 'text-align:right;font-weight:bold;color:' + (S.enCero[i] ? RED : MUTED) + ';">' + S.enCero[i] + '</td></tr>';
      });
      h += wrap(t1 + '</table>');

      // Supplies: por pedir y checklist en NO
      function listaUnidades(arr, titulo, hint, vacio, colName, color) {
        var o = title(titulo + ' (' + arr.length + ')', hint);
        if (!arr.length) return o + '<div style="font-size:' + fs + 'px;color:' + GRN + ';margin:6px 2px;">' + E(vacio) + '</div>';
        var t = '<table style="width:100%;border-collapse:collapse;"><tr><td style="' + th + '">' + E(colName) + '</td><td style="' + th + 'text-align:center;">' + E(R.units) + '</td><td style="' + th + '">' + E(R.where) + '</td></tr>';
        arr.forEach(function (x) {
          t += '<tr><td style="' + td + 'font-weight:bold;white-space:nowrap;vertical-align:top;">' + E(nameOf(x.item)) + '</td>' +
            '<td style="' + td + 'text-align:center;font-weight:bold;color:' + color + ';vertical-align:top;">' + x.units.length + '</td>' +
            '<td style="' + td + 'color:' + MUTED + ';line-height:1.6;">' + E(x.units.map(function (u) { return u.unit + ' (' + u.client + ')'; }).join(' · ')) + '</td></tr>';
        });
        return o + wrap(t + '</table>');
      }
      if (isSup) {
        h += listaUnidades(r.porPedir, R.toOrder, R.toOrderHint, R.orderNone, R.item, AMB);
        h += listaUnidades(r.checklistNo, R.checkNo, R.checkHint, R.checkNone, R.point, RED);
      }

      // Por cliente
      h += title(R.byClient);
      var t2 = '<table style="width:100%;border-collapse:collapse;"><tr><td style="' + th + '">' + E(R.client) + '</td>' +
        '<td style="' + th + 'text-align:center;">' + E(R.units) + '</td><td style="' + th + 'text-align:center;">✔</td><td style="' + th + 'text-align:center;">✖</td>' +
        '<td style="' + th + 'text-align:center;">' + E(R.lastCount) + '</td>';
      r.items.forEach(function (it) { t2 += '<td style="' + th + 'text-align:center;">' + E(short(it)) + '</td>'; });
      t2 += '<td style="' + th + 'text-align:center;">' + E(R.totalPcs) + '</td><td style="' + th + 'text-align:center;">' + E(R.drops) + '</td>' +
        (isSup ? '<td style="' + th + 'text-align:center;">' + E(R.order) + '</td><td style="' + th + 'text-align:center;">' + E(R.chk) + '</td>' : '') + '</tr>';
      r.perClient.forEach(function (c) {
        t2 += '<tr><td style="' + td + 'font-weight:bold;">' + E(c.client) + '</td>' +
          '<td style="' + td + 'text-align:center;">' + c.units + '</td>' +
          '<td style="' + td + 'text-align:center;color:' + GRN + ';font-weight:bold;">' + c.contadas + '</td>' +
          '<td style="' + td + 'text-align:center;color:' + (c.sin ? RED : MUTED) + ';font-weight:bold;">' + c.sin + '</td>' +
          '<td style="' + td + 'text-align:center;white-space:nowrap;">' + E(c.ultima || '-') + '</td>';
        c.totals.forEach(function (v) { t2 += '<td style="' + td + 'text-align:center;">' + (c.contadas ? n(v) : '-') + '</td>'; });
        t2 += '<td style="' + td + 'text-align:center;font-weight:bold;">' + (c.contadas ? n(c.total) : '-') + '</td>' +
          '<td style="' + td + 'text-align:center;font-weight:bold;color:' + (c.bajas ? RED : MUTED) + ';">' + n(c.bajas) + '</td>' +
          (isSup ? '<td style="' + td + 'text-align:center;font-weight:bold;color:' + (c.pedir ? AMB : MUTED) + ';">' + c.pedir + '</td>' +
            '<td style="' + td + 'text-align:center;font-weight:bold;color:' + (c.check ? RED : MUTED) + ';">' + c.check + '</td>' : '') + '</tr>';
      });
      h += wrap(t2 + '</table>');

      // Por edificio
      if (r.perBuilding && r.perBuilding.length) {
        h += title(R.byBuilding);
        var tb = '<table style="width:100%;border-collapse:collapse;"><tr><td style="' + th + '">' + E(R.bld) + '</td>' +
          '<td style="' + th + 'text-align:center;">' + E(R.units) + '</td><td style="' + th + 'text-align:center;">✔</td><td style="' + th + 'text-align:center;">✖</td>';
        r.items.forEach(function (it) { tb += '<td style="' + th + 'text-align:center;">' + E(short(it)) + '</td>'; });
        tb += '<td style="' + th + 'text-align:center;">' + E(R.totalPcs) + '</td><td style="' + th + 'text-align:center;">' + E(R.drops) + '</td>' +
          (isSup ? '<td style="' + th + 'text-align:center;">' + E(R.order) + '</td><td style="' + th + 'text-align:center;">' + E(R.chk) + '</td>' : '') + '</tr>';
        r.perBuilding.forEach(function (B) {
          tb += '<tr><td style="' + td + 'font-weight:bold;white-space:nowrap;">' + E(B.building) +
            '<div style="font-size:' + (fs - 2) + 'px;color:' + MUTED + ';font-weight:normal;">' + E(B.clients.join(', ')) + '</div></td>' +
            '<td style="' + td + 'text-align:center;">' + B.units + '</td>' +
            '<td style="' + td + 'text-align:center;color:' + GRN + ';font-weight:bold;">' + B.contadas + '</td>' +
            '<td style="' + td + 'text-align:center;color:' + (B.sin ? RED : MUTED) + ';font-weight:bold;">' + B.sin + '</td>';
          B.totals.forEach(function (v) { tb += '<td style="' + td + 'text-align:center;">' + (B.contadas ? n(v) : '-') + '</td>'; });
          tb += '<td style="' + td + 'text-align:center;font-weight:bold;">' + (B.contadas ? n(B.total) : '-') + '</td>' +
            '<td style="' + td + 'text-align:center;font-weight:bold;color:' + (B.bajas ? RED : MUTED) + ';">' + n(B.bajas) + '</td>' +
            (isSup ? '<td style="' + td + 'text-align:center;font-weight:bold;color:' + (B.pedir ? AMB : MUTED) + ';">' + B.pedir + '</td>' +
              '<td style="' + td + 'text-align:center;font-weight:bold;color:' + (B.check ? RED : MUTED) + ';">' + B.check + '</td>' : '') + '</tr>';
        });
        h += wrap(tb + '</table>');
      }

      // Por unidad
      if (r.perUnit.length) {
        h += title(R.byUnit, r.porCama ? R.byUnitHint : R.byUnitHint2);
        var t3 = '<table style="width:100%;border-collapse:collapse;"><tr>' +
          '<td style="' + th + '">' + E(R.bld) + ' · ' + E(R.unit) + '</td>' + (r.porCama ? '<td style="' + th + '">' + E(R.bed) + '</td>' : '') +
          '<td style="' + th + '">' + E(R.date) + '</td><td style="' + th + 'text-align:center;">' + E(R.days) + '</td>';
        r.items.forEach(function (it) { t3 += '<td style="' + th + 'text-align:center;">' + E(short(it)) + '</td>'; });
        t3 += '<td style="' + th + 'text-align:center;">' + E(R.totalPcs) + '</td><td style="' + th + 'text-align:center;">' + E(R.delta) + '</td>' +
          (isSup ? '<td style="' + th + 'text-align:center;">' + E(R.order) + '</td><td style="' + th + 'text-align:center;">' + E(R.chk) + '</td>' : '') + '</tr>';
        var lastClient = null, ncols = 5 + (r.porCama ? 1 : 0) + (isSup ? 2 : 0) + r.items.length;
        r.perUnit.forEach(function (u) {
          if (u.client !== lastClient) {
            lastClient = u.client;
            t3 += '<tr><td colspan="' + ncols + '" style="padding:8px 6px 4px;font-size:' + fs + 'px;font-weight:bold;color:' + TEAL + ';border-bottom:1px solid ' + LINE + ';">' + E(u.client) + '</td></tr>';
          }
          var name = u.building + ' · ' + (u.locker ? '🔒 ' + R.locker : u.unit);
          var link = String(u.pdf).indexOf('http') === 0 ? '<a href="' + E(u.pdf) + '" target="_blank" style="color:' + INK + ';text-decoration:none;">' + E(name) + '</a>' : E(name);
          t3 += '<tr><td style="' + td + 'white-space:nowrap;">' + link + '<div style="font-size:' + (fs - 2) + 'px;color:' + MUTED + ';">' + E(u.cleaner) + (u.side ? ' · ' + E(u.side) : '') + (u.otros ? ' · ' + E(R.others) + ': ' + E(u.otros) : '') + '</div>' +
            (u.pedir && u.pedir.length ? '<div style="font-size:' + (fs - 2) + 'px;color:' + AMB + ';font-weight:bold;">' + E(R.order) + ': ' + E(u.pedir.map(nameOf).join(', ')) + '</div>' : '') +
            (u.check && u.check.length ? '<div style="font-size:' + (fs - 2) + 'px;color:' + RED + ';font-weight:bold;">' + E(R.chk) + ': ' + E(u.check.map(nameOf).join(', ')) + '</div>' : '') + '</td>' +
            (r.porCama ? '<td style="' + td + '">' + E(u.size || '-') + '</td>' : '') +
            '<td style="' + td + 'white-space:nowrap;">' + E(u.fecha) + '</td>' +
            '<td style="' + td + 'text-align:center;color:' + (u.dias > 30 ? AMB : MUTED) + ';font-weight:' + (u.dias > 30 ? 'bold' : 'normal') + ';">' + u.dias + '</td>';
          u.vals.forEach(function (v, i) {
            var zero = v === 0;
            t3 += '<td style="' + td + 'text-align:center;white-space:nowrap;' + (zero ? 'background:' + REDBG + ';color:' + RED + ';font-weight:bold;' : '') + '">' + n(v) + dchip(u.diffs[i]) + '</td>';
          });
          t3 += '<td style="' + td + 'text-align:center;font-weight:bold;">' + n(u.total) + '</td>' +
            '<td style="' + td + 'text-align:center;font-weight:bold;color:' + (u.totalDiff < 0 ? RED : u.totalDiff > 0 ? GRN : MUTED) + ';" title="' + E(u.prevFecha ? u.prevFecha : R.firstNote) + '">' +
            (u.totalDiff === null ? '-' : (u.totalDiff > 0 ? '+' : '') + n(u.totalDiff)) + '</td>' +
            (isSup ? '<td style="' + td + 'text-align:center;font-weight:bold;color:' + (u.pedir.length ? AMB : MUTED) + ';" title="' + E(u.pedir.join(', ')) + '">' + u.pedir.length + '</td>' +
              '<td style="' + td + 'text-align:center;font-weight:bold;color:' + (u.check.length ? RED : MUTED) + ';" title="' + E(u.check.join(', ')) + '">' + u.check.length + '</td>' : '') + '</tr>';
        });
        h += wrap(t3 + '</table>');
      }

      // Sin inventario
      h += title(R.noInv + ' (' + r.sinInventario.length + ')');
      if (!r.sinInventario.length) {
        h += '<div style="font-size:' + fs + 'px;color:' + GRN + ';margin:6px 2px;">' + E(R.noInvNone) + '</div>';
      } else {
        var byC = {}, orderC = [];
        r.sinInventario.forEach(function (u) { if (!byC[u.client]) { byC[u.client] = []; orderC.push(u.client); } byC[u.client].push(u); });
        var t4 = '<table style="width:100%;border-collapse:collapse;">';
        orderC.forEach(function (c) {
          var list = byC[c].map(function (u) { return u.building + ' ' + (u.locker ? '(' + R.locker + ')' : u.unit); });
          t4 += '<tr><td style="' + td + 'font-weight:bold;vertical-align:top;white-space:nowrap;width:1%;">' + E(c) + ' <span style="color:' + MUTED + ';font-weight:normal;">(' + list.length + ')</span></td>' +
            '<td style="' + td + 'color:' + MUTED + ';line-height:1.6;">' + E(list.join(' · ')) + '</td></tr>';
        });
        h += t4 + '</table>';
      }

      h += '<table style="width:100%;border-collapse:collapse;margin-top:18px;border-top:1px solid ' + LINE + ';"><tr>' +
        '<td style="padding-top:8px;font-size:' + (fs - 1) + 'px;color:' + MUTED + ';"><b style="color:' + INK + ';">Clean My BnB</b> · ' + E(R.kickers[r.tipo] || '') + '</td>' +
        '<td style="padding-top:8px;font-size:' + (fs - 1) + 'px;color:' + MUTED + ';text-align:right;">' + E(r.generado) + '</td></tr></table></div>';
      return h;
    }

    // ==========================================
    // ARRANQUE
    // ==========================================
    (function boot() {
      if (BOOT.hub) document.getElementById('lnk-hub').style.display = 'inline-block';
      try { var saved = localStorage.getItem(LISTS_KEY); if (saved) staffData = JSON.parse(saved); } catch (e) {}
      if (currentSide) setSide(currentSide);
      else { document.getElementById('view-side').style.display = 'block'; applyLang(); }
      loadLists(false);
    })();
  </script>
</body>
</html>
